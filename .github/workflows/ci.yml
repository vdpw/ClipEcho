name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Swift app (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: Apple Silicon
            runner: macos-15
            binary_arch: arm64
          - architecture: Intel
            runner: macos-15-intel
            binary_arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Swift 6.4.1
        run: ./scripts/setup-ci-swift.sh

      - name: Test Swift core
        run: ./scripts/test.sh

      - name: Build release app
        run: ./scripts/build-app.sh release

      - name: Prepare CI display for window size checks
        timeout-minutes: 2
        run: ./scripts/prepare-ci-display.sh

      - name: Run isolated AppKit and WebKit self-test
        timeout-minutes: 5
        run: ./scripts/self-test.sh

      - name: Verify app signature and architecture
        env:
          EXPECTED_ARCH: ${{ matrix.binary_arch }}
        run: |
          codesign --verify --deep --strict --verbose=2 build/ClipEcho.app
          test "$(lipo -archs build/ClipEcho.app/Contents/MacOS/ClipEcho)" = "$EXPECTED_ARCH"
