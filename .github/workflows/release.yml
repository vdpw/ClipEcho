name: Publish Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build macOS ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Swift 6.4.1
        run: ./scripts/setup-ci-swift.sh

      - name: Test Swift core
        run: ./scripts/test.sh

      - name: Build release app
        run: ./scripts/build-app.sh release

      - name: Run isolated AppKit and WebKit self-test
        timeout-minutes: 5
        run: ./scripts/self-test.sh

      - name: Package and verify ad-hoc signed app
        env:
          RELEASE_ARCH: ${{ matrix.architecture }}
        run: ./scripts/package-release.sh "$RELEASE_TAG" "$RELEASE_ARCH"

      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.architecture }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified macOS packages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download both architecture packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Verify package set and publish once
        shell: bash
        run: |
          set -euo pipefail
          cd release
          version="${RELEASE_TAG#v}"
          assets=()
          for architecture in arm64 x86_64; do
            stem="ClipEcho-${version}-macos-${architecture}"
            for extension in zip dmg sha256; do
              test -s "${stem}.${extension}"
              assets+=("${stem}.${extension}")
            done
            sha256sum --check "${stem}.sha256"
          done
          release_args=(--repo "$GH_REPO")
          if gh release view "$RELEASE_TAG" "${release_args[@]}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" "${release_args[@]}" --clobber
          else
            if [[ "$version" == *-* ]]; then release_args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${assets[@]}" "${release_args[@]}" \
              --verify-tag --title "ClipEcho $RELEASE_TAG" --generate-notes
          fi
